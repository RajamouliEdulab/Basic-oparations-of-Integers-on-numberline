<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice Dashboard</title>
    <style>
        /* BUG FIX: box-sizing was never reset, so padding on the container
           and buttons could push widths past 100% on narrow screens */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: max(0.75rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right))
                      max(0.75rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* accounts for mobile browser toolbars */
        }

        .dashboard-container {
            text-align: center;
            /* Fluid padding instead of a fixed 2rem that felt cramped on tiny screens */
            padding: clamp(1.25rem, 5vw, 2rem);
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 100%;
        }

        .dashboard-container h1 {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            margin-bottom: 0.5rem;
            color: #f8fafc;
            line-height: 1.2;
        }

        .dashboard-container p {
            color: #ffff00;
            margin-bottom: clamp(1.5rem, 5vw, 2.5rem);
            font-size: clamp(0.9rem, 3vw, 1.1rem);
        }

        /* Grid Layout for Buttons */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
            gap: clamp(0.85rem, 3vw, 1.5rem);
        }

        /* Base Flash Button Styling */
        .flash-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(1.25rem, 5vw, 2rem) 1rem;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-size: clamp(1rem, 3.5vw, 1.25rem);
            font-weight: 600;
            letter-spacing: 1px;
            background: #334155;
            border: 2px solid transparent;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            touch-action: manipulation; /* removes tap delay / stray double-tap zoom */
            -webkit-tap-highlight-color: transparent;
        }

        .flash-btn .symbol {
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: bold;
            margin-bottom: 0.5rem;
            transition: transform 0.3s ease;
        }

        /* Glow and Hover Effects (desktop / mouse) */
        .flash-btn:hover {
            transform: translateY(-5px) scale(1.02);
            background: #0f172a;
        }

        .flash-btn:hover .symbol {
            transform: scale(1.2);
        }

        /* BUG FIX: keyboard users had no visible focus indicator since the
           default border was overridden by the colored border-color rules */
        .flash-btn:focus-visible {
            outline: 3px solid #f8fafc;
            outline-offset: 3px;
        }

        /* Specific Button Colors (Neon Glow) */

        /* Addition - Green */
        .btn-add { border-color: #22c55e; }
        .btn-add .symbol { color: #22c55e; }
        .btn-add:hover {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4), inset 0 0 15px rgba(34, 197, 94, 0.2);
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
        }

        /* Subtraction - Red */
        .btn-sub { border-color: #ef4444; }
        .btn-sub .symbol { color: #ef4444; }
        .btn-sub:hover {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2);
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
        }

        /* Multiplication - Blue */
        .btn-mul { border-color: #3b82f6; }
        .btn-mul .symbol { color: #3b82f6; }
        .btn-mul:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), inset 0 0 15px rgba(59, 130, 246, 0.2);
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
        }

        /* Division - Purple */
        .btn-div { border-color: #a855f7; }
        .btn-div .symbol { color: #a855f7; }
        .btn-div:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
        }

        /* Sweep Animation overlay */
        .flash-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transition: left 0.5s ease;
        }

        .flash-btn:hover::before {
            left: 100%;
        }

        /* BUG FIX: touch devices have no ":hover" so tapping gave zero feedback.
           This gives a matching press effect on tap without needing a mouse. */
        @media (hover: none) {
            .flash-btn:active {
                transform: scale(0.97);
                background: #0f172a;
            }
            .flash-btn:active .symbol {
                transform: scale(1.1);
            }
        }

        /* Respect users who've asked for reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .flash-btn, .flash-btn .symbol, .flash-btn::before {
                transition: none !important;
            }
            .flash-btn:hover,
            .flash-btn:active {
                transform: none !important;
            }
        }

        /* Extra floor for very small phones */
        @media (max-width: 340px) {
            .dashboard-container { padding: 1rem; border-radius: 14px; }
            .flash-btn { padding: 1rem 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Interactive Practice</h1>
        <p>Choose an operation to start practicing</p>

        <div class="button-grid">
            <!-- Addition Button -->
            <!-- Update the href attribute to point to your actual practice page/script -->
            <a href="https://tmfmancherial.weebly.com/addition.html" class="flash-btn btn-add">
                <span class="symbol">+</span>
                Addition
            </a>

            <!-- Subtraction Button -->
            <a href="https://tmfmancherial.weebly.com/subtraction.html" class="flash-btn btn-sub">
                <span class="symbol">−</span>
                Subtraction
            </a>

            <!-- Multiplication Button -->
            <a href="https://tmfmancherial.weebly.com/multiplicaton.html" class="flash-btn btn-mul">
                <span class="symbol">×</span>
                Multiplication
            </a>

            <!-- Division Button -->
            <a href="https://tmfmancherial.weebly.com/divisions.html" class="flash-btn btn-div">
                <span class="symbol">÷</span>
                Division
            </a>
        </div>
    </div>

</body>
</html>
